# Política de dependências (ADR 0008). Rode: cargo deny check
[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # `ttf-parser` sem manutenção (não é falha de segurança). Chega pelo winit (decorações de
    # janela no Wayland), dentro do Slint; sai quando o Slint atualizar o winit (ADR 0002).
    { id = "RUSTSEC-2026-0192", reason = "transitivo do Slint/winit; revisar a cada versão do Slint" },
    # `zbus_names`, `zvariant` e `zvariant_derive` viraram módulos do `zbus` 6 (não é falha de
    # segurança). Chegam pela acessibilidade do Slint no Linux (accesskit/atspi) e pelo rfd; saem
    # quando eles passarem para o `zbus` 6 (ADR 0002).
    { id = "RUSTSEC-2026-0370", reason = "transitivo do Slint/rfd; revisar a cada versão do Slint" },
    { id = "RUSTSEC-2026-0371", reason = "transitivo do Slint/rfd; revisar a cada versão do Slint" },
    { id = "RUSTSEC-2026-0372", reason = "transitivo do Slint/rfd; revisar a cada versão do Slint" },
]

[licenses]
# Permissivas apenas. GPL/LGPL ficam de fora porque o Rust liga estaticamente.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Boost: permissiva como a MIT (dependência do Slint para a área de transferência).
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9

# Slint (ADR 0002): usamos a licença Royalty-free 2.0, que pede a atribuição "Feito com Slint" na
# tela Sobre. A GPL da licença tripla não é a escolhida.
[[licenses.exceptions]]
crate = "i-slint-backend-linuxkms"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-backend-selector"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-backend-testing"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-backend-winit"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-common"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-compiler"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-core"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-core-macros"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-renderer-femtovg"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
crate = "i-slint-renderer-skia"
allow = ["LicenseRef-Slint-Royalty-free-2.0"]

[[licenses.exceptions]]
