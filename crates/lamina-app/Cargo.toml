[package]
name = "lamina-app"
description = "Interface gráfica do Lamina, em Slint (ADR 0002)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
lamina-core = { workspace = true }
lamina-editor = { workspace = true }
lamina-layout = { workspace = true }
anyhow = { workspace = true }
slint = { workspace = true }
rfd = { workspace = true }
velopack = { workspace = true }

[dev-dependencies]
image = { workspace = true }
tempfile = { workspace = true }

[build-dependencies]
slint-build = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
winresource = { workspace = true }

# Os lints do workspace, com uma diferença: `unsafe_code` é `deny` (e não `forbid`) para o módulo
# `ui`, gerado pelo Slint, poder liberar o `unsafe` dele. O nosso código continua sem `unsafe`
# (AGENTS.md, regra 3; ADR 0002).
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
panic = "warn"
unreachable = "warn"
unimplemented = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
