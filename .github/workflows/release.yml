name: Release

# Distribuição (spec DS, regras 11 a 14; ADR 0009). Roda na tag `v*` do repositório público:
# `vX.Y.Z` é estável; `vX.Y.Z-beta.N` é versão de teste (pre-release, canal `<sistema>-beta`).
#
# 1. confere: a tag bate com o Cargo.toml e as novidades (`cargo xtask versao`) e abre a release
#    em rascunho, com as notas da versão.
# 2. pacote (Windows, macOS universal, Linux): compila, empacota com o vpk, instala pelo script
#    do terminal e abre o álbum de fumaça (`--verificar`). No Windows e no macOS, também o pacote
#    do Claude Desktop (`.mcpb`, spec IA, decisão 4), com o binário `lamina` dentro e o manifesto
#    gerado do catálogo das ferramentas (`cargo xtask mcpb`). Só então envia ao rascunho.
# 3. publica: SHA256SUMS e os scripts de instalação, e tira do rascunho. Se qualquer sistema
#    falhar, a release fica em rascunho (invisível) e nada é publicado.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  VPK: "1.2.161"
  # CLI oficial dos pacotes do Claude Desktop (ADR 0010, adendo), com a versão presa.
  MCPB: "2.1.2"
  REPO_URL: https://github.com/${{ github.repository }}
  BUNDLE_ID: io.github.alberthpalhares.lamina

jobs:
  confere:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      beta: ${{ steps.v.outputs.beta }}
    steps:
      - uses: actions/checkout@v4
      - name: Versão, CHANGELOG e notas
        id: v
        run: |
          cargo xtask versao "$GITHUB_REF_NAME" --notas notas.md
          # A atribuição do Slint na página de download (licença royalty-free, opção 2b; ADR 0002).
          printf '\n\n[![Made with Slint](https://raw.githubusercontent.com/slint-ui/slint/master/logo/MadeWithSlint-logo-whitebg.png)](https://slint.dev)\n' >> notas.md
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "beta=true" >> "$GITHUB_OUTPUT" ;; *) echo "beta=false" >> "$GITHUB_OUTPUT" ;; esac
      - name: Release em rascunho
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          if [ "${{ steps.v.outputs.beta }}" = true ]; then pre="--prerelease"; fi
          # Uma tag refeita depois de uma falha reaproveita o rascunho que ficou.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft $pre \
              --title "Lamina ${{ steps.v.outputs.version }}" --notes-file notas.md
      - uses: actions/upload-artifact@v4
        with:
          name: notas
          path: notas.md

  pacote:
    name: Pacote (${{ matrix.os }})
    needs: confere
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            sistema: win
          - os: macos-latest
            sistema: osx
          - os: ubuntu-22.04
            sistema: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.confere.outputs.version }}
      CHANNEL: ${{ needs.confere.outputs.beta == 'true' && format('{0}-beta', matrix.sistema) || matrix.sistema }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: notas

      - name: Dependências do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libxkbcommon-x11-0: um desktop Linux já tem; a máquina do CI, não (o AppImage abre sob X11).
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libfuse2 xvfb

      - name: Compilar (Windows e Linux)
        if: runner.os != 'macOS'
        shell: bash
        run: |
          cargo build --profile dist -p lamina-app -p lamina-cli
          mkdir publish
          cp target/dist/lamina-app* publish/
          rm -f publish/*.d publish/*.pdb
          # O álbum de exemplo vai ao lado do programa (spec PC, regra 8).
          cp -r crates/lamina-app/exemplo publish/

      - name: Compilar (macOS universal)
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --profile dist -p lamina-app -p lamina-cli --target aarch64-apple-darwin
          cargo build --profile dist -p lamina-app -p lamina-cli --target x86_64-apple-darwin
          cargo build --profile dist -p lamina-cli
          mkdir publish
          lipo -create -output publish/lamina-app \
            target/aarch64-apple-darwin/dist/lamina-app target/x86_64-apple-darwin/dist/lamina-app
          lipo -archs publish/lamina-app
          # O álbum de exemplo vai ao lado do programa, dentro do .app (spec PC, regra 8).
          cp -r crates/lamina-app/exemplo publish/
          # O `lamina` universal vai no pacote do Claude Desktop (fora do instalador; spec DS).
          mkdir cli-universal
          lipo -create -output cli-universal/lamina \
            target/aarch64-apple-darwin/dist/lamina target/x86_64-apple-darwin/dist/lamina
          lipo -archs cli-universal/lamina

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Instalar o vpk
        run: dotnet tool install -g vpk --version ${{ env.VPK }}

      - name: Empacotar
        shell: bash
        run: |
          mkdir releases
          # A versão anterior do mesmo canal, para o pacote de diferença (na primeira, não há).
          # Nas betas, a anterior é uma pre-release: sem o --pre, o vpk não a vê e não há diferença.
          pre=""
          if [ "${{ needs.confere.outputs.beta }}" = true ]; then pre="--pre"; fi
          vpk download github --repoUrl "$REPO_URL" --channel "$CHANNEL" --token "$GH_TOKEN" $pre -o releases || true
          ls releases > anteriores.txt
          # No Mac, o Info.plist nosso, com o tipo de documento .lamina (spec MA, seção 4).
          sed -e "s/@VERSAO@/$VERSION/" -e "s/@VERSAO_CURTA@/${VERSION%%-*}/" \
            crates/lamina-app/dist/Info.plist > Info.plist
          case "${{ matrix.sistema }}" in
            win)   extra=(--runtime win-x64 --icon crates/lamina-app/icons/lamina.ico -e lamina-app.exe) ;;
            osx)   extra=(--icon crates/lamina-app/icons/lamina.icns --bundleId "$BUNDLE_ID" -e lamina-app --plist Info.plist) ;;
            linux) extra=(--runtime linux-x64 --icon crates/lamina-app/icons/lamina-512.png -e lamina-app) ;;
          esac
          vpk pack -u Lamina -v "$VERSION" -p publish --packTitle Lamina --packAuthors "Equipe Lamina" \
            --channel "$CHANNEL" --releaseNotes notas.md -o releases "${extra[@]}"
          # O .pkg só para todos os usuários (/Applications), com o app em nome de quem instala.
          if [ "${{ matrix.sistema }}" = osx ]; then
            for f in releases/*Setup.pkg; do sh crates/lamina-app/dist/ajustar-pkg.sh "$f"; done
          fi
          # Só o que esta versão criou vai para a release (o que veio da anterior já está lá).
          ls releases | grep -vxF -f anteriores.txt > novos.txt || true
          grep -q "releases.$CHANNEL.json" novos.txt || echo "releases.$CHANNEL.json" >> novos.txt
          echo "### Pacotes ($CHANNEL)" >> "$GITHUB_STEP_SUMMARY"
          (cd releases && ls -la $(cat ../novos.txt)) | tee -a "$GITHUB_STEP_SUMMARY"
          # O SHA256SUMS deste sistema, para o teste de fumaça usar o script do terminal.
          cd releases
          for f in *Setup.exe *Portable.zip *.AppImage; do
            [ -f "$f" ] && { sha256sum "$f" 2>/dev/null || shasum -a 256 "$f"; }
          done > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/setup-node@v4
        if: runner.os != 'Linux'
        with:
          node-version: "20"
      - name: Pacote do Claude Desktop (Windows e macOS)
        # Não há Claude Desktop para Linux (spec IA, seção 10).
        if: runner.os != 'Linux'
        shell: bash
        run: |
          case "${{ matrix.sistema }}" in
            win) bin=target/dist/lamina.exe; sistema=windows; nome=Lamina-Windows.mcpb ;;
            osx) bin=cli-universal/lamina; sistema=macos; nome=Lamina-macOS.mcpb ;;
          esac
          cargo xtask mcpb "$sistema" "$bin" pacote-mcpb
          # Fumaça: o binário de dentro do pacote roda.
          ./pacote-mcpb/server/$(basename "$bin") --version
          npx -y "@anthropic-ai/mcpb@$MCPB" validate pacote-mcpb/manifest.json
          npx -y "@anthropic-ai/mcpb@$MCPB" pack pacote-mcpb "releases/$nome"
          npx -y "@anthropic-ai/mcpb@$MCPB" info "releases/$nome"
          echo "$nome" >> novos.txt

      - name: Álbum de fumaça
        shell: bash
        run: |
          cargo xtask fotos fumaca/fotos 8
          cargo run --profile dist -q -p lamina-cli -- build fumaca/fotos --saida fumaca/album \
            --laminas 2 --largura-cm 10 --altura-cm 10 --dpi 100

      - name: Teste de fumaça (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 10
        run: |
          $env:LAMINA_FONTE = "$PWD\releases"
          pwsh -NoProfile -File crates/lamina-app/dist/instalar.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Start-Sleep -Seconds 5
          # O Setup abre o Lamina ao terminar (lição do spike): fechar antes de verificar.
          Get-Process lamina-app -ErrorAction SilentlyContinue | Stop-Process -Force
          $app = "$env:LOCALAPPDATA\Lamina\current\lamina-app.exe"
          $p = Start-Process $app -ArgumentList '--verificar', "$PWD\fumaca\album\fotos.lamina" -PassThru -RedirectStandardError erro.txt
          if (-not $p.WaitForExit(120000)) { $p.Kill(); "verificar passou de 2 min"; exit 1 }
          Get-Content erro.txt -ErrorAction SilentlyContinue
          "verificar saiu com $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
          # O álbum de exemplo que veio no pacote abre (spec PC, regra 8).
          $p = Start-Process $app -ArgumentList '--verificar', 'exemplo' -PassThru -RedirectStandardError erro-exemplo.txt
          if (-not $p.WaitForExit(120000)) { $p.Kill(); "verificar exemplo passou de 2 min"; exit 1 }
          Get-Content erro-exemplo.txt -ErrorAction SilentlyContinue
          "verificar exemplo saiu com $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
          # O gancho da instalação registrou o .lamina (spec DS, regra 10).
          $tipo = (Get-ItemProperty 'HKCU:\Software\Classes\.lamina').'(default)'
          "associação: $tipo"
          if ($tipo -ne 'Lamina.Album') { exit 1 }

      - name: Teste de fumaça (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: |
          LAMINA_FONTE="$PWD/releases" sh crates/lamina-app/dist/instalar.sh
          # Na pasta Aplicativos do Mac, declarando o .lamina (spec MA).
          app="/Applications/Lamina.app"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist" | grep -qx "$VERSION"
          /usr/libexec/PlistBuddy -c 'Print :UTExportedTypeDeclarations:0:UTTypeTagSpecification:public.filename-extension:0' \
            "$app/Contents/Info.plist" | grep -qx lamina
          codesign -dv "$app" 2>&1 | grep -E "Signature|Format" || true
          lipo -archs "$app/Contents/MacOS/lamina-app"
          "$app/Contents/MacOS/lamina-app" --verificar "$PWD/fumaca/album/fotos.lamina"
          # O exemplo dentro do .app e a assinatura com ele (spec PC, regra 8).
          codesign --verify --deep --strict "$app" && echo "assinatura ok" || echo "ATENÇÃO: assinatura"
          "$app/Contents/MacOS/lamina-app" --verificar exemplo

      - name: Teste de fumaça (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          LAMINA_FONTE="$PWD/releases" sh crates/lamina-app/dist/instalar.sh
          xvfb-run -a "$HOME/.local/bin/Lamina.AppImage" --verificar "$PWD/fumaca/album/fotos.lamina"
          xvfb-run -a "$HOME/.local/bin/Lamina.AppImage" --verificar exemplo

      - name: Enviar ao rascunho
        shell: bash
        run: |
          cd releases
          gh release upload "$GITHUB_REF_NAME" $(cat ../novos.txt) --clobber

  publica:
    needs: [confere, pacote]
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      # Token de um robô do dono para abrir o pedido no microsoft/winget-pkgs (spec DS, seção 8).
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: SHA256SUMS e os scripts de instalação
        run: |
          mkdir pacotes && cd pacotes
          gh release download "$GITHUB_REF_NAME" -p '*Setup.exe' -p '*Portable.zip' -p '*.AppImage' -p '*Setup.pkg' -p '*.mcpb'
          sha256sum * > ../SHA256SUMS
          cd ..
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS \
            crates/lamina-app/dist/instalar.sh crates/lamina-app/dist/instalar.ps1 --clobber
      - name: Publicar
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
      - name: winget (só nas estáveis, com o token do dono)
        if: needs.confere.outputs.beta == 'false' && env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Lamina.Lamina
          installers-regex: 'win.*Setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}

  # Os comandos do README, exatamente como estão, depois de publicar: a instalação pela internet
  # nos três sistemas e cada link do README (Rodada 0, R0-15 e R0-16). O teste de fumaça do
  # `pacote` instala de uma pasta; este passa pelo endereço de verdade.
  instalacao:
    name: Instalação pelo README (${{ matrix.os }})
    needs: publica
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Os scripts consultam a API do GitHub; sem login, as máquinas do CI esbarram no limite.
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Comando do README (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          irm https://raw.githubusercontent.com/alberthpalhares/lamina-albuns/main/crates/lamina-app/dist/instalar.ps1 | iex
          Start-Sleep -Seconds 5
          Get-Process lamina-app -ErrorAction SilentlyContinue | Stop-Process -Force
          $p = Start-Process "$env:LOCALAPPDATA\Lamina\current\lamina-app.exe" -ArgumentList '--verificar', 'exemplo' -PassThru -RedirectStandardError erro.txt
          # No Windows PowerShell 5.1, sem guardar o Handle o código de saída vem vazio.
          $null = $p.Handle
          if (-not $p.WaitForExit(120000)) { $p.Kill(); "verificar passou de 2 min"; exit 1 }
          Get-Content erro.txt -ErrorAction SilentlyContinue
          "verificar exemplo saiu com $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Comando do README (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL https://raw.githubusercontent.com/alberthpalhares/lamina-albuns/main/crates/lamina-app/dist/instalar.sh | sh
          "/Applications/Lamina.app/Contents/MacOS/lamina-app" --verificar exemplo
      - name: Comando do README (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libxkbcommon-x11-0 libfontconfig1 xvfb
          curl -fsSL https://raw.githubusercontent.com/alberthpalhares/lamina-albuns/main/crates/lamina-app/dist/instalar.sh | sh
          xvfb-run -a "$HOME/.local/bin/Lamina.AppImage" --verificar exemplo
      - name: Cada link do README abre
        if: runner.os == 'Linux'
        run: |
          falhou=0
          for url in $(grep -oE 'https://[^ )`"<>]+' README.md | sort -u); do
            if curl -sSfIL --retry 2 -o /dev/null "$url"; then echo "ok  $url"; else echo "FALHOU  $url"; falhou=1; fi
          done
          for alvo in $(grep -oE '\]\([^)#h][^)]*\)' README.md | sed 's/^](//; s/)$//' | sort -u); do
            if [ -e "$alvo" ]; then echo "ok  $alvo"; else echo "FALTA  $alvo"; falhou=1; fi
          done
          exit $falhou
