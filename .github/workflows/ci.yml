name: CI

# Plano de economia de minutos (2026-10-16, decisão do dono): o CI roda só no repositório
# público (lamina-albuns). Em PR e na main, só Linux; Windows e macOS só à mão (Actions → CI →
# Run workflow), antes de fechar um marco. O Windows também é coberto pelo `cargo xtask verify`
# local, que roda antes de todo PR.
on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "LICENSE"]
  pull_request:
    paths-ignore: ["README.md", "LICENSE"]
  workflow_dispatch:
    inputs:
      todos:
        description: "Rodar também no Windows e no macOS"
        type: boolean
        default: true

# Um commit novo cancela a rodada anterior do mesmo PR ou branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  testes:
    name: Testes (${{ matrix.os }})
    if: github.repository == 'alberthpalhares/lamina-albuns'
    strategy:
      fail-fast: true
      matrix:
        os: ${{ (github.event_name == 'workflow_dispatch' && inputs.todos) && fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # O rustup lê o rust-toolchain.toml e instala a versão fixada.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      # O Slint (lamina-app) precisa destas bibliotecas do sistema no Linux (ADR 0002).
      - name: Bibliotecas do Linux para a interface
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev
      # A mesma porta de verificação que a equipe roda localmente.
      - name: Porta de verificação
        run: cargo xtask verify

  licencas:
    name: Licenças e avisos de segurança
    if: github.repository == 'alberthpalhares/lamina-albuns'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
