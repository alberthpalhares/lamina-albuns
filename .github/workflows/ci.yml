name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  testes:
    name: Testes (${{ matrix.os }})
    # O CI roda só no repositório público (lamina-codigo): minutos de graça. O privado guarda os
    # documentos e usa o `cargo xtask verify` local.
    if: github.repository == 'alberthpalhares/lamina-codigo'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # O rustup lê o rust-toolchain.toml e instala a versão fixada.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      # O Slint (lamina-app) precisa destas bibliotecas do sistema no Linux (ADR 0002).
      - name: Bibliotecas do Linux para a interface
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev
      # A mesma porta de verificação que a equipe roda localmente:
      # formatação, clippy, testes, camadas, specs, assertivas, sala limpa, documentos,
      # alerta de tamanho e licenças.
      - name: Porta de verificação
        run: cargo xtask verify

  licencas:
    name: Licenças e avisos de segurança
    if: github.repository == 'alberthpalhares/lamina-codigo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
